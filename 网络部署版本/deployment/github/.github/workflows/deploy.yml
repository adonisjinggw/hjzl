name: 🚀 部署幻境之旅生成器到GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📁 Checkout代码
      uses: actions/checkout@v4
      
    - name: 🟢 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 安装依赖
      run: npm ci
      
    - name: 🔧 创建环境配置
      run: |
        echo "创建生产环境配置..."
        echo "GEMINI_API_KEY=demo_mode" > .env.production
        echo "NODE_ENV=production" >> .env.production
        
    - name: 🏗️ 构建项目
      run: npm run build
      env:
        NODE_ENV: production
        
    - name: 📤 上传构建产物
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: 🚀 部署到GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 